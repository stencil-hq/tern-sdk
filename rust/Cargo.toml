[package]
edition = "2024"
name = "tern-sdk"
version = "0.1.0"
authors = ["Stencil Labs, Inc."]
build = false
publish = true
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Talk to Tern over the Tern Surface Protocol: typed node builders, diffing with derived ids, flow control, event routing, print/ask helpers and a plain-text fallback."
readme = "README.md"
license = "MIT"
repository = "https://github.com/stencil-hq/tern-sdk"

[lib]
name = "tern_sdk"
path = "src/lib.rs"

[[example]]
name = "ask"
path = "examples/ask.rs"

[[example]]
name = "chat"
path = "examples/chat.rs"

[[example]]
name = "progress"
path = "examples/progress.rs"

[[example]]
name = "table"
path = "examples/table.rs"

[[test]]
name = "session"
path = "tests/session.rs"

[dependencies.base64]
version = "0.23.1"

[dependencies.serde]
version = "1.0.229"
features = [
    "alloc",
    "derive",
    "rc",
]

[dependencies.serde_json]
version = "1.0.151"
features = [
    "float_roundtrip",
    "preserve_order",
    "raw_value",
]

[dependencies.sha2]
version = "0.11.0"

[dependencies.thiserror]
version = "2.0.21"

[dependencies.tracing]
version = "0.1.44"

[project]
name = "tern-sdk"
version = "0.1.0"
description = "Talk to Tern over the Tern Surface Protocol: typed nodes, diffing, flow control, events, and a plain-text fallback."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Stencil Labs, Inc." }]
dependencies = []

[project.urls]
Repository = "https://github.com/stencil-hq/tern-sdk"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tern_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
strict = true
python_version = "3.11"
